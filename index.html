<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milad Davaloo</title>
<style>
  :root {
    color-scheme: light;
    --fg: #1a1a1a;
    --muted: #666;
    --bg: #fff;
  }
  * {
    box-sizing: border-box;
  }
  html, body {
    margin: 0;
    min-height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font-family: monospace;
    text-align: left;
    padding: 1.5rem;
  }
  h1 {
    font-size: 10rem;
    font-weight: 400;
    margin: 0 0 0.5rem;
    line-height: 1.1;
  }
  p {
    color: var(--muted);
    margin: 0 0 1.5rem;
    font-size: 4.375rem;
  }
  a {
    color: inherit;
    text-decoration: none;
    font-size: 4.375rem;
  }
  a.nevoya {
    color: #21504e;
  }
</style>
</head>
<body>
  <div>
    <h1>milad davaloo</h1>
    <p>head of data science @ <a class="nevoya" href="https://nevoya.com">nevoya</a></p>
    <a href="https://github.com/dmilad">github.com/dmilad</a>
  </div>
</body>
</html>
