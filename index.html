<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milad Davaloo</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #1a1a1a;
    --muted: #666;
    --bg: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #eee; --muted: #999; --bg: #111; }
  }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    text-align: center;
    padding: 1.5rem;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    margin: 0 0 0.4rem;
  }
  p {
    color: var(--muted);
    margin: 0 0 1.25rem;
    font-size: 1rem;
  }
  a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid var(--muted);
  }
  a:hover {
    border-bottom-color: var(--fg);
  }
</style>
</head>
<body>
  <div>
    <h1>Milad Davaloo</h1>
    <p>Head of Data Science at Nevoya</p>
    <a href="https://github.com/dmilad">github.com/dmilad</a>
  </div>
</body>
</html>
